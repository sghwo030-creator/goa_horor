<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terjebak di Goa Wendigo</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Courier New', Courier, monospace;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ff3333;
            font-size: 20px;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
        }
        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border: 2px solid #ff3333;
            border-radius: 10px;
            cursor: pointer;
        }
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0000;
            text-align: center;
            font-size: 40px;
            font-weight: bold;
            text-shadow: 0 0 10px #000;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    
    <div id="ui">
        <div>Jarak Wendigo: <span id="distance">Aman</span></div>
        <div style="font-size: 14px; color: #aaa; margin-top: 5px;">Gunakan WASD/Panah untuk bergerak. Gerakkan mouse untuk melihat sekitar.</div>
    </div>

    <div id="instructions">
        <h1>TERJEBAK DI GOA WENDIGO</h1>
        <p>Klik di sini untuk mulai bermain</p>
        <p style="font-size: 14px; color: #ff8888;">Jangan biarkan bayangan merah menangkapmu...</p>
    </div>

    <div id="game-over">
        KAMU MATI DIMAKAN WENDIGO!
        <p style="font-size: 20px; color: white; margin-top: 20px;">Refresh halaman untuk coba lagi</p>
    </div>

    <script>
        // --- SETUP DASAR THREE.JS ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        // Beri kabut (fog) tebal biar suasana goa terasa gelap dan mencekam
        scene.fog = new THREE.FogExp2(0x050505, 0.15); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // --- ELEMEN GAMEPLAY ---
        let isGameOver = false;
        let gameStarted = false;
        
        // Pemain (Kamera berfungsi sebagai sudut pandang pemain)
        camera.position.set(0, 2, 0);
        const playerSpeed = 0.15;
        const move = { forward: false, backward: false, left: false, right: false };
        
        // Kontrol Mouse (Pointer Lock)
        const instructions = document.getElementById('instructions');
        instructions.addEventListener('click', () => {
            container.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === container) {
                instructions.style.display = 'none';
                gameStarted = true;
            } else if (!isGameOver) {
                instructions.style.display = 'block';
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement !== container || isGameOver) return;
            camera.rotation.y -= e.movementX * 0.002;
            camera.rotation.x -= e.movementY * 0.002;
            // Batasi dongakan kamera supaya tidak salto
            camera.rotation.x = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.5, camera.rotation.x));
        });

        // Deteksi Input Keyboard
        const onKeyDown = (e) => {
            if (e.key === 'w' || e.key === 'ArrowUp') move.forward = true;
            if (e.key === 's' || e.key === 'ArrowDown') move.backward = true;
            if (e.key === 'a' || e.key === 'ArrowLeft') move.left = true;
            if (e.key === 'd' || e.key === 'ArrowRight') move.right = true;
        };
        const onKeyUp = (e) => {
            if (e.key === 'w' || e.key === 'ArrowUp') move.forward = false;
            if (e.key === 's' || e.key === 'ArrowDown') move.backward = false;
            if (e.key === 'a' || e.key === 'ArrowLeft') move.left = false;
            if (e.key === 'd' || e.key === 'ArrowRight') move.right = false;
        };
        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);

        // --- LINGKUNGAN (GOA) ---
        // Lantai Goa
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Pilar-pilar Batu Stalaktit/Stalagmit di dalam goa
        const pillars = [];
        const pillarGeo = new THREE.CylinderGeometry(0.5, 1.5, 15, 6);
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 1.0 });
        
        for(let i = 0; i < 40; i++) {
            const pillar = new THREE.Mesh(pillarGeo, pillarMat);
            // Sebar pilar secara acak di area game
            pillar.position.set(
                (Math.random() - 0.5) * 80,
                7.5,
                (Math.random() - 0.5) * 80
            );
            scene.add(pillar);
            pillars.push(pillar); // Disimpan jika nanti ingin buat sistem deteksi tabrakan (collision)
        }

        // --- PENCAHAYAAN (SENTER PEMAIN) ---
        // Senter yang menempel pada kamera pemain
        const flashlight = new THREE.SpotLight(0xffffff, 2, 30, Math.PI / 6, 0.5, 1);
        scene.add(flashlight);
        flashlight.target = new THREE.Object3D();
        scene.add(flashlight.target);

        // Cahaya ambient tipis agar goa tidak hitam pekat total
        const ambientLight = new THREE.AmbientLight(0x0a0a1a, 0.5);
        scene.add(ambientLight);

        // --- MUSUH: WENDIGO ---
        // Representasi Wendigo: Sosok humanoid kurus tinggi berwarna hitam abu-abu dengan mata merah menyala
        const wendigoGroup = new THREE.Group();
        
        // Badan
        const bodyGeo = new THREE.CylinderGeometry(0.3, 0.1, 3, 5);
        const wendigoMat = new THREE.MeshBasicMaterial({ color: 0x0d0d0d });
        const wendigoBody = new THREE.Mesh(bodyGeo, wendigoMat);
        wendigoBody.position.y = 1.5;
        wendigoGroup.add(wendigoBody);

        // Mata Merah Menyala (Glow)
        const eyeGeo = new THREE.SphereGeometry(0.08, 8, 8);
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        
        const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
        leftEye.position.set(-0.15, 3.1, 0.3);
        const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
        rightEye.position.set(0.15, 3.1, 0.3);
        
        wendigoGroup.add(leftEye, rightEye);

        // Aura merah tipis di sekitar Wendigo supaya terlihat mengerikan dari jauh
        const wendigoLight = new THREE.PointLight(0xff0000, 1, 8);
        wendigoLight.position.y = 2;
        wendigoGroup.add(wendigoLight);

        // Posisi awal Wendigo (agak jauh dari pemain)
        wendigoGroup.position.set(20, 0, -20);
        scene.add(wendigoGroup);

        const wendigoSpeed = 0.065; // Kecepatan Wendigo mengejar

        // --- GAME LOOP ---
        const distanceUI = document.getElementById('distance');
        const gameOverUI = document.getElementById('game-over');

        function animate() {
            requestAnimationFrame(animate);

            if (gameStarted && !isGameOver) {
                // Update Posisi Senter mengikuti Kamera
                flashlight.position.copy(camera.position);
                const direction = new THREE.Vector3();
                camera.getWorldDirection(direction);
                flashlight.target.position.copy(camera.position).add(direction);

                // Pergerakan Pemain (Berdasarkan arah pandang kamera)
                const forwardVector = new THREE.Vector3(direction.x, 0, direction.z).normalize();
                const sideVector = new THREE.Vector3().crossVectors(camera.up, forwardVector).normalize();

                if (move.forward) camera.position.addScaledVector(forwardVector, playerSpeed);
                if (move.backward) camera.position.addScaledVector(forwardVector, -playerSpeed);
                if (move.left) camera.position.addScaledVector(sideVector, playerSpeed);
                if (move.right) camera.position.addScaledVector(sideVector, -playerSpeed);

                // Batasi ruang gerak pemain agar tidak lari terlalu jauh keluar goa (Batas 45 unit)
                camera.position.x = Math.max(-45, Math.min(45, camera.position.x));
                camera.position.z = Math.max(-45, Math.min(45, camera.position.z));

                // AI Wendigo: Selalu berputar menghadap pemain dan mengejarnya
                wendigoGroup.lookAt(camera.position.x, wendigoGroup.position.y, camera.position.z);
                
                const wendigoDir = new THREE.Vector3().subVectors(camera.position, wendigoGroup.position);
                wendigoDir.y = 0; // Tetap di tanah
                wendigoDir.normalize();
                wendigoGroup.position.addScaledVector(wendigoDir, wendigoSpeed);

                // Hitung Jarak Pemain dengan Wendigo
                const distance = camera.position.distanceTo(wendigoGroup.position);
                
                // Update UI Indikator Jarak
                if (distance > 25) {
                    distanceUI.innerText = "Aman (Jauh)";
                    distanceUI.style.color = "#33ff33";
                } else if (distance > 10) {
                    distanceUI.innerText = "Mendekat...";
                    distanceUI.style.color = "#ffff33";
                } else {
                    distanceUI.innerText = "DIA DI BELAKANGMU!!";
                    distanceUI.style.color = "#ff0000";
                }

                // Kondisi Kalah (Kena Tangkap Wendigo)
                if (distance < 1.8) {
                    isGameOver = true;
                    document.exitPointerLock();
                    gameOverUI.style.display = 'block';
                }
            }

            renderer.render(scene, camera);
        }

        // Handle ukuran layar jika berubah
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
